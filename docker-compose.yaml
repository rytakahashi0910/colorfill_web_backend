services:
  colorfill-backend:
    # 生成するイメージ名
    image: springboot-jdk21-app
    # 生成するコンテナ名
    container_name: colorfill-backend
    # dockerイメージビルド時の処理
    build: 
      context: .
      dockerfile: ./docker/java/Dockerfile
    hostname: localhost
    # ポートマッピング設定（ホストPCのポート：コンテナ内のポート）
    ports:
      - "8080:8080" # コンテナ作成時のビルド内容はhttp://localhost:8080に、
      - "8000:8880" # コンテナ作成後のビルド内容はhttp://localhost:8000に反映される
    # マウンティングの設定 （ホストPCのパス：コンテナ内のパス）
    volumes:
      - ./:/app
    # 環境変数の設定
    environment:
      TZ: Asia/Tokyo
    # 接続するネットワーク 
    networks:
      - colorfillnetwork

  nginx:
    image: nginx:latest
    container_name: colorfill-nginx
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - colorfill-backend
    networks:
      - colorfillnetwork

  colorfill-db:
    # 生成するイメージ名
    image: mysql:8.0
    # 生成するコンテナ名
    container_name: colorfill-db
    hostname: localhost
    ports:
      - "2206:22"
      - '3306:3306'
    environment:
      MYSQL_DATABASE: colorfill
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: colorfill
      TZ: 'Asia/Tokyo'
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/mysql/data:/var/lib/mysql
    privileged: true
    networks:
      - colorfillnetwork

networks:
  colorfillnetwork:
    driver: bridge
#     ipam:
#       driver: default